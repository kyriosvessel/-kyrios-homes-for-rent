name: Build Signed Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kyrios-homes-release.jks"
          test -s "$RUNNER_TEMP/kyrios-homes-release.jks"

      - name: Build signed APK
        env:
          STORE_PASSWORD: ${{ secrets.KYRIOS_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KYRIOS_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KYRIOS_KEY_ALIAS }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease \
            -PKYRIOS_STORE_FILE="$RUNNER_TEMP/kyrios-homes-release.jks" \
            -PKYRIOS_STORE_PASSWORD="$STORE_PASSWORD" \
            -PKYRIOS_KEY_ALIAS="$KEY_ALIAS" \
            -PKYRIOS_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kyrios-Homes-For-Rent-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
